<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send 下载诊断</title>
    <style>
      body { font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
             max-width: 760px; margin: 32px auto; padding: 0 18px; color: #1f2328; line-height: 1.65; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      .sub { color: #57606a; font-size: 14px; margin: 0 0 20px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
              border: 1px solid #d0d7de; border-radius: 6px; }
      button { margin-top: 12px; padding: 10px 18px; font-size: 15px; border-radius: 6px;
               border: 1px solid #1f883d; background: #1f883d; color: #fff; }
      pre { margin-top: 18px; padding: 14px; background: #f6f8fa; border: 1px solid #d0d7de;
            border-radius: 8px; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 60px; }
      .ok { color: #1a7f37; font-weight: 600; }
      .bad { color: #cf222e; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Send 下载诊断</h1>
    <p class="sub">
      粘贴完整的 Send 链接（形如 <code>https://vault.ifyi.top/#/send/…/…</code>），点「检查」。
      页面会依次请求 访问 → 文件信息 → 下载，并把**声明大小**和**实际收到的字节数**都打出来。
    </p>
    <input id="url" placeholder="https://vault.ifyi.top/#/send/XXXX/YYYY" />
    <button id="go">检查</button>
    <pre id="out">等待检查…</pre>

    <script>
      const out = document.getElementById('out');
      const lines = [];
      const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

      document.getElementById('go').addEventListener('click', async () => {
        lines.length = 0;
        out.textContent = '';
        const raw = document.getElementById('url').value.trim();
        const m = raw.match(/#\/send\/([^/?#]+)/) || raw.match(/\/send\/([^/?#]+)/);
        if (!m) return log('❌ 没能从链接里解析出 Send ID');
        const accessId = m[1];
        const base = location.origin;
        log('Send ID: ' + accessId);
        log('');

        // 1) 匿名访问
        let r = await fetch(base + '/api/sends/access/' + encodeURIComponent(accessId), {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}', cache: 'no-store',
        });
        let text = await r.text();
        log('1) POST /api/sends/access -> ' + r.status);
        log('   ' + text.slice(0, 500));
        if (!r.ok) return;
        let send; try { send = JSON.parse(text); } catch { return log('   ❌ 返回不是 JSON'); }
        const declared = send.file?.size ?? send.data?.size ?? '?';
        log('   声明大小: ' + declared);
        log('');

        // 2) 文件信息（拿下载 url）
        const fileId = send.file?.id ?? send.id;
        r = await fetch(base + '/api/sends/access/file/' + encodeURIComponent(fileId), {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}', cache: 'no-store',
        });
        text = await r.text();
        log('2) POST /api/sends/access/file/' + fileId + ' -> ' + r.status);
        log('   ' + text.slice(0, 500));
        if (!r.ok) return;
        let info; try { info = JSON.parse(text); } catch { return log('   ❌ 返回不是 JSON'); }
        if (!info.url) return log('   ❌ 没有 url 字段');
        log('');

        // 3) 下载
        const t0 = performance.now();
        r = await fetch(info.url, { cache: 'no-store' });
        const buf = await r.arrayBuffer();
        const ms = (performance.now() - t0).toFixed(0);
        log('3) GET 下载地址 -> ' + r.status + '  (' + ms + ' ms)');
        log('   响应头 content-length: ' + (r.headers.get('content-length') ?? '(无)'));
        log('   响应头 content-type:   ' + (r.headers.get('content-type') ?? '(无)'));
        log('   实际收到字节: ' + buf.byteLength);
        log('   声明大小:     ' + declared);
        log('');
        const a = Number(declared), b = buf.byteLength;
        if (!Number.isFinite(a)) log('（声明大小无法比较）');
        else if (a === b) log('✅ 大小一致：服务端发的是完整数据，问题在客户端解密或浏览器。');
        else log('❌ 大小不一致：少了 ' + (a - b) + ' 字节 → 传输被截断（平台响应体限制）。');
      });
    </script>
  </body>
</html>
